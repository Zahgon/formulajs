name: Tests
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -q -DskipTests package
      - run: mvn -B test
      - run: TZ="America/Los_Angeles" mvn -B test
      - name: The command answers a request
        run: test "$(printf '{"op":"SUM","args":[1,2,3]}\n' | bin/formulajs)" = '{"result":6}'
